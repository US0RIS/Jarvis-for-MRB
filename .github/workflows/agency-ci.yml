name: Agency 1.0 CI

on:
  push:
    branches:
      - jarvis/agency-1.0
  pull_request:
    branches:
      - main

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run full Python regression suite
        shell: pwsh
        env:
          JARVIS_AGENCY_MODE: monitor
        run: python -m unittest discover -s tests -v

      - name: Run isolated fixed-endpoint acceptance
        shell: pwsh
        env:
          JARVIS_AGENCY_MODE: monitor
        run: python -m jarvis_mrb.world_acceptance_check
