name: Agency 1.0 CI

on:
  push:
    branches:
      - jarvis/agency-1.0
      - jarvis/situation-evidence-unification
      - jarvis/world-armor-phase1-kernel
      - jarvis/world-armor-correlation-workbench
      - jarvis/world-armor-standing-watches
      - jarvis/world-armor-attention-inbox
      - jarvis/world-armor-global-public-cameras
      - jarvis/world-armor-open-observation-platform
  pull_request:
    branches:
      - main

concurrency:
  group: agency-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile Python sources
        run: python -m compileall -q jarvis_mrb tests

  agency-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Agency synthetic acceptance smoke
        shell: pwsh
        env:
          JARVIS_AGENCY_MODE: monitor
        run: python -m unittest discover -s tests -p "test_agency_acceptance.py" -v

  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run full Python regression suite
        shell: pwsh
        env:
          JARVIS_AGENCY_MODE: monitor
        run: python -m unittest discover -s tests -v

      - name: Run isolated fixed-endpoint acceptance
        shell: pwsh
        env:
          JARVIS_AGENCY_MODE: monitor
        run: python -m jarvis_mrb.world_acceptance_check
