name: Horus Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "jarvis_mrb/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "tests/test_mission_control_ui.py"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Horus and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.16.0
      - name: Check BYOK and voice contracts
        run: |
          python -m unittest discover -s tests -p "test_mission_control_ui.py" -v
          python -m unittest discover -s tests -p "test_desktop_setup_state.py" -v
          python -m unittest discover -s tests -p "test_phone_pairing.py" -v
          python -m unittest discover -s tests -p "test_windows_background_processes.py" -v
          python -m unittest discover -s tests -p "test_mission_control.py" -v
          python -m unittest discover -s tests -p "test_proactive_briefing.py" -v
          python -m unittest discover -s tests -p "test_byok_inference.py" -v
          python -m unittest discover -s tests -p "test_callless.py" -v
          python -m unittest discover -s tests -p "test_remote_setup_idempotent.py" -v
      - name: Build self-contained Windows runtime
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Horus --hidden-import mission_control --hidden-import desktop_setup_state --collect-submodules jarvis_mrb --collect-submodules keyring.backends --collect-data jarvis_mrb packaging/horus_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\Horus\Horus.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build HorusSetup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\Horus.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist-installer -Filter "HorusSetup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer .exe was not created" }
          Get-FileHash $exe.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: HorusSetup-Windows
          path: dist-installer/HorusSetup-*.exe
          retention-days: 30
          if-no-files-found: error
