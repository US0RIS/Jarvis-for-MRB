name: MemoMind iOS bridge

on:
  push:
    branches:
      - jarvis/memomind-prep
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/memomind-ios.yml"

concurrency:
  group: memomind-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  command-view-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python modules
        run: python -m compileall -q jarvis_mrb tests
      - name: Verify read-only command view
        run: python -m unittest discover -s tests -p "test_agency_command_view.py" -v
      - name: Verify standalone phone and Gen 1 Meta UI routing
        run: python -m unittest discover -s tests -p "test_standalone_physical_ui.py" -v
      - name: Verify deterministic model-free planner bypass
        run: python -m unittest discover -s tests -p "test_deterministic_dispatch.py" -v
      - name: Verify conversational voice and non-compulsory Jarvis address
        run: python -m unittest discover -s tests -p "test_conversational_personality.py" -v
      - name: Verify opportunistic glass sightings require explicit goals and never actuate
        run: python -m unittest discover -s tests -p "test_opportunity_radar.py" -v
      - name: Verify explicit structured meeting actions and semantic fallback
        run: python -m unittest discover -s tests -p "test_explicit_meeting_actions.py" -v
      - name: Install provider HTTP client for isolated tests
        run: python -m pip install httpx
      - name: Verify model-free research, briefs and safe read-only workflows
        run: python -m unittest discover -s tests -p "test_model_free_subsystems.py" -v
      - name: Verify research receipt invariants after deterministic query planning
        run: python -m unittest discover -s tests -p "test_search_integrity.py" -v
      - name: Verify Agency completion contract safeguards after deterministic first pass
        run: python -m unittest discover -s tests -p "test_agency_goal_compiler.py" -v
      - name: Verify weather and air-quality source handling
        run: python -m unittest discover -s tests -p "test_physical_conditions.py" -v
      - name: Verify multisource situational briefing
        run: python -m unittest discover -s tests -p "test_physical_awareness.py" -v
      - name: Verify official earthquake source
        run: python -m unittest discover -s tests -p "test_public_incidents.py" -v
      - name: Verify aggregated regional airspace
        run: python -m unittest discover -s tests -p "test_public_airspace.py" -v
      - name: Verify external watch persistence and matter isolation
        run: python -m unittest discover -s tests -p "test_external_watches.py" -v
      - name: Verify SEC source facts and matter diligence
        run: python -m unittest discover -s tests -p "test_public_diligence.py" -v
      - name: Verify exact EPA ECHO facility evidence
        run: python -m unittest discover -s tests -p "test_public_epa.py" -v
      - name: Verify local OFAC candidate screening
        run: python -m unittest discover -s tests -p "test_ofac_screen.py" -v
      - name: Verify worldwide public resource boundaries
        run: python -m unittest discover -s tests -p "test_public_facilities.py" -v
      - name: Verify official camera provider boundaries
        run: python -m unittest discover -s tests -p "test_public_camera_catalog.py" -v
      - name: Verify opt-in official camera vision boundary
        run: python -m unittest discover -s tests -p "test_public_camera_vision.py" -v

  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Jarvis iPhone simulator app
        run: |
          xcodebuild \
            -project ios/JarvisIOS.xcodeproj \
            -scheme JarvisIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/jarvis-derived-data" \
            CODE_SIGNING_ALLOWED=NO build
