[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-for-mrb"
version = "0.13.0"
description = "Personal agent backend for Ray-Ban Meta glasses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psutil>=6.0.0",
  "Pillow>=11.0.0",  # optional interactive Windows screen capture; fails closed headless
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "httpx>=0.28.0",
  "websockets>=15.0.0",  # server-side AISStream movement adapter
  "dateparser>=1.2.2",
  "tzdata>=2025.2",  # ZoneInfo city routing on Windows lacks an OS IANA database
  "google-api-python-client>=2.180.0",
  "google-auth>=2.40.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.2",
  "pypdf>=5.0.0",
  "openpyxl>=3.1.5",
  "pycaw",
  "comtypes",
]

[project.scripts]
jarvis = "jarvis_mrb.cli:main"
jarvis-service = "jarvis_mrb.service:main"
jarvis-install-startup = "jarvis_mrb.startup:main"
jarvis-google-auth = "jarvis_mrb.google_auth:main"
jarvis-browser-setup = "jarvis_mrb.browser_setup:main"
jarvis-remote-setup = "jarvis_mrb.remote_setup:main"
jarvis-serper-setup = "jarvis_mrb.serper_setup:main"
jarvis-world-check = "jarvis_mrb.world_check:main"
jarvis-world-migrate = "jarvis_mrb.world_migrate:main"
jarvis-world-prepare = "jarvis_mrb.world_prepare:main"
jarvis-world-acceptance = "jarvis_mrb.world_acceptance_check:main"
jarvis-world-movement = "jarvis_mrb.world_armor_movement:main"
jarvis-cover-score = "jarvis_mrb.cover_universal_cli:main"
jarvis-20 = "jarvis_mrb.jarvis20_cli:main"
jarvis-agency-acceptance = "jarvis_mrb.agency_acceptance_check:main"
jarvis-agency-release-check = "jarvis_mrb.agency_release_check:main"
jarvis-agency-real-gate = "jarvis_mrb.agency_real_acceptance_check:main"

[tool.setuptools.packages.find]
include = ["jarvis_mrb*"]
