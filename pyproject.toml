[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-for-mrb"
version = "0.2.0"
description = "Personal agent backend for Ray-Ban Meta glasses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psutil>=6.0.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "httpx>=0.28.0",
]

[project.scripts]
jarvis = "jarvis_mrb.cli:main"
jarvis-service = "jarvis_mrb.service:main"
jarvis-install-startup = "jarvis_mrb.startup:main"

[tool.setuptools.packages.find]
include = ["jarvis_mrb*"]
